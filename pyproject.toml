[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-trace-local"
version = "0.1.0"
description = "Local tracing and debugging for LLM applications"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
llm-trace = "llm_trace.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
